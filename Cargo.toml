[package]
name = "ghostline-red"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast native Cyberpunk 2077 archive and CR2W tooling"
repository = "https://github.com/hlky/ghostline-red"
readme = "README.md"
keywords = ["cyberpunk-2077", "cr2w", "modding", "archive"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5"
libloading = "0.8"
rayon = "1.11"
regex = "1.12"
half = "2.6"
image = { version = "0.25", default-features = false, features = ["png"] }
pathdiff = "0.2"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "unbounded_depth"] }
serde_stacker = "0.1"
sha1 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
texture2ddecoder = "0.1"

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
undocumented_unsafe_blocks = "warn"
